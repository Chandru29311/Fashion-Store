<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — STACKLY Client Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

  <!-- Top Bar with Back to Home -->
  <div class="auth-header-bar">
    <a href="index.html" class="back-home-link">
      <i class="fa-solid fa-arrow-left"></i> BACK TO HOME
    </a>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card" id="signup-card-el">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <a href="index.html" style="display: inline-block; text-decoration: none;">
          <img src="assets/logo01.webp" alt="STACKLY Logo" style="height: 46px; width: auto; filter: drop-shadow(0 0 12px rgba(201,160,80,0.4));">
        </a>
      </div>
      <h2>CREATE YOUR ACCOUNT.</h2>
      <div class="auth-subtitle">Join the STACKLY fashion community</div>

      <!-- Role Selector -->
      <div class="role-selector">
        <div class="role-option active" id="srole-client" onclick="selectSignupRole('Client')">CLIENT</div>
        <div class="role-option" id="srole-admin" onclick="selectSignupRole('Admin')">ADMIN</div>
      </div>

      <div id="signup-error-alert" style="display: none; background: rgba(176,141,87,0.2); color: #B08D57; border: 1px solid #B08D57; padding: 0.8rem; margin-bottom: 1rem; font-size: 0.8rem; text-align: center;"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="signup-name">FULL NAME *</label>
          <input type="text" id="signup-name" class="form-control" placeholder="e.g. Arun Kumar" required>
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">EMAIL ADDRESS *</label>
          <input type="email" id="signup-email" class="form-control" placeholder="e.g. arun@example.com" required>
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">PASSWORD *</label>
          <input type="password" id="signup-password" class="form-control" placeholder="Minimum 6 characters" required>
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-confirm">CONFIRM PASSWORD *</label>
          <input type="password" id="signup-confirm" class="form-control" placeholder="Re-enter password" required>
          <div class="error-message"></div>
        </div>

        <button type="submit" class="btn-accent" style="width: 100%; margin-top: 1rem;">SIGN UP</button>
      </form>

      <div class="auth-footer-link">
        Already have an account? <a href="Login.html">Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let selectedSignupRole = 'Client';

    function selectSignupRole(role) {
      selectedSignupRole = role;
      document.querySelectorAll('.role-option').forEach(el => el.classList.remove('active'));
      document.getElementById(`srole-${role.toLowerCase()}`).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        gsap.from('#signup-card-el', { y: 40, opacity: 0, duration: 0.8, ease: 'power3.out' });
      }

      const form = document.getElementById('signup-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const pass = document.getElementById('signup-password').value.trim();
        const confirmPass = document.getElementById('signup-confirm').value.trim();
        const errAlert = document.getElementById('signup-error-alert');

        errAlert.style.display = 'none';

        if (!name || !email || !pass || !confirmPass) {
          errAlert.textContent = 'Please fill out all required fields.';
          errAlert.style.display = 'block';
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          errAlert.textContent = 'Please enter a valid email address.';
          errAlert.style.display = 'block';
          return;
        }

        if (pass.length < 6) {
          errAlert.textContent = 'Password must be at least 6 characters long.';
          errAlert.style.display = 'block';
          return;
        }

        if (pass !== confirmPass) {
          errAlert.textContent = 'Passwords do not match.';
          errAlert.style.display = 'block';
          return;
        }

        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'CREATING ACCOUNT...';

        setTimeout(() => {
          signupUser(name, email, pass, selectedSignupRole);
          window.location.href = 'Login.html';
        }, 1000);
      });
    });
  </script>
</body>
</html>
