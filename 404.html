<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — STACKLY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body" style="justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow: hidden; margin: 0; padding: 0;">

  <!-- Minimal Brand Header Bar -->
  <div class="auth-header-bar" style="position: absolute; top: 0; left: 0; width: 100%; z-index: 10;">
    <a href="index.html" class="back-home-link">
      <i class="fa-solid fa-arrow-left"></i> BACK TO HOME
    </a>
  </div>

  <!-- 404 Standalone Content Card -->
  <div class="auth-wrapper" style="width: 100%; z-index: 2; display: flex; justify-content: center; align-items: center;">
    <div class="gold-frame" id="404-container-el" style="width: 100%; max-width: 780px; background: rgba(20, 22, 29, 0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-accent); border-radius: var(--radius-md); padding: 3.5rem 3rem 4.5rem 3rem; text-align: center; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 35px rgba(201, 160, 80, 0.2);">
      
      <!-- STACKLY Brand Logo in Red Marked Area -->
      <a href="index.html" id="404-logo-el" style="display: inline-block; margin-bottom: 1rem; text-decoration: none;">
        <img src="assets/logo01.webp" alt="STACKLY Logo" style="height: 48px; width: auto; filter: drop-shadow(0 0 12px rgba(201,160,80,0.5));">
      </a>

      <div id="404-num-el" style="font-family: var(--font-display); font-size: clamp(6rem, 14vw, 11rem); line-height: 0.85; color: var(--accent); opacity: 0.95; margin-bottom: 1.8rem; letter-spacing: -0.04em; text-shadow: 0 0 25px rgba(201, 160, 80, 0.4);">
        404
      </div>

      <h1 id="404-headline-el" style="font-family: var(--font-display); font-size: clamp(1.8rem, 3.5vw, 2.8rem); line-height: 1.25; margin-bottom: 1.2rem; letter-spacing: 0.06em; color: var(--secondary);">
        THE STYLE YOU'RE LOOKING FOR DOESN'T EXIST HERE.
      </h1>

      <p id="404-desc-el" style="color: rgba(250, 248, 245, 0.75); max-width: 520px; margin: 0 auto 2.8rem auto; font-size: 1.02rem; line-height: 1.75;">
        The requested look or page has been moved, archived, or is temporarily out of season.
      </p>

      <div id="404-btns-el" style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;">
        <button onclick="history.back()" class="btn-outline">BACK</button>
        <a href="index.html" class="btn-accent">BACK TO HOME</a>
      </div>
    </div>
  </div>

  <!-- Ambient Editorial Background Layer -->
  <div id="404-bg-img" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; opacity: 0.22; pointer-events: none;">
    <img src="assets/404-fashion.webp" alt="404 Fashion Background" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline();
        tl.from('#404-container-el', { duration: 0.9, scale: 0.94, opacity: 0, ease: 'power3.out' })
          .from('#404-logo-el', { duration: 0.7, y: -20, opacity: 0, ease: 'power2.out' }, '-=0.5')
          .from('#404-num-el', { duration: 0.8, y: -20, opacity: 0, ease: 'power2.out' }, '-=0.4')
          .from('#404-headline-el', { duration: 0.7, y: 15, opacity: 0, ease: 'power2.out' }, '-=0.4')
          .from('#404-desc-el', { duration: 0.6, opacity: 0 }, '-=0.3')
          .from('#404-btns-el', { duration: 0.6, y: 15, opacity: 0 }, '-=0.3');

        // Subtle Parallax on Mouse Move
        window.addEventListener('mousemove', (e) => {
          const moveX = (e.clientX / window.innerWidth - 0.5) * 15;
          const moveY = (e.clientY / window.innerHeight - 0.5) * 15;
          gsap.to('#404-bg-img', { x: moveX, y: moveY, duration: 1, ease: 'power1.out' });
        });
      }
    });
  </script>
</body>
</html>
