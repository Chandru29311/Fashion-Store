<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — STACKLY Client Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">

  <!-- Top Bar with Back to Home -->
  <div class="auth-header-bar">
    <a href="index.html" class="back-home-link">
      <i class="fa-solid fa-arrow-left"></i> BACK TO HOME
    </a>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card" id="auth-card-el">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <a href="index.html" style="display: inline-block; text-decoration: none;">
          <img src="assets/logo01.webp" alt="STACKLY Logo" style="height: 46px; width: auto; filter: drop-shadow(0 0 12px rgba(201,160,80,0.4));">
        </a>
      </div>
      <h2>WELCOME BACK.</h2>
      <div class="auth-subtitle">Access your personalized portal</div>

      <!-- Role Selector -->
      <div class="role-selector">
        <div class="role-option active" id="role-client" onclick="selectLoginRole('Client')">CLIENT</div>
        <div class="role-option" id="role-admin" onclick="selectLoginRole('Admin')">ADMIN</div>
      </div>

      <div id="login-error-alert" style="display: none; background: rgba(176,141,87,0.2); color: #B08D57; border: 1px solid #B08D57; padding: 0.8rem; margin-bottom: 1rem; font-size: 0.8rem; text-align: center;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">EMAIL ADDRESS</label>
          <input type="email" id="login-email" class="form-control" placeholder="client@stackly.com" required>
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">PASSWORD</label>
            <a href="404.html" style="font-size: 0.75rem; color: var(--accent);">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <div class="error-message"></div>
        </div>

        <button type="submit" class="btn-accent" style="width: 100%; margin-top: 1rem;">LOGIN</button>
      </form>

      <div class="auth-footer-link">
        Don't have an account? <a href="Signup.html">Create an account</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let selectedRole = 'Client';

    function selectLoginRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-option').forEach(el => el.classList.remove('active'));
      document.getElementById(`role-${role.toLowerCase()}`).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        gsap.from('#auth-card-el', { y: 40, opacity: 0, duration: 0.8, ease: 'power3.out' });
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const errAlert = document.getElementById('login-error-alert');

        if (!email || !password) {
          errAlert.textContent = 'Please enter both email and password.';
          errAlert.style.display = 'block';
          return;
        }

        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'AUTHENTICATING...';

        setTimeout(() => {
          loginUser(email, password, selectedRole);
          if (selectedRole === 'Admin') {
            window.location.href = 'AdminDashboard.html';
          } else {
            window.location.href = 'ClientDashboard.html';
          }
        }, 800);
      });
    });
  </script>
</body>
</html>
